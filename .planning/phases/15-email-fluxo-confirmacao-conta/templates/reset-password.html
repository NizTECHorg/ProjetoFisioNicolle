<!-- Dashboard: Reset password | Subject: Redefina sua senha na Fluxo -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redefina sua senha na Fluxo</title>
</head>
<body style="margin:0;padding:0;background:#f5f7fa;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f7fa;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border-radius:12px;padding:32px 28px;">
          <tr>
            <td>
              <p style="margin:0 0 8px;color:#0b1d36;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;">
                Fluxo
              </p>
              <h1 style="margin:0 0 16px;color:#0b1d36;font-family:Arial,Helvetica,sans-serif;font-size:22px;line-height:1.3;font-weight:700;">
                Redefina sua senha na Fluxo
              </h1>
              <p style="margin:0 0 24px;color:#102038;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;">
                Recebemos um pedido para redefinir a senha da sua conta Fluxo. Clique no botão abaixo para escolher uma nova senha.
              </p>
              <p style="margin:0 0 28px;">
                <a href="{{ .ConfirmationURL }}"
                   style="display:inline-block;background:#0b1d36;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:600;">
                  Redefinir senha
                </a>
              </p>
              <p style="margin:0;color:#5a6b80;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;">
                Se você não pediu a redefinição de senha, ignore este e-mail. Sua conta Fluxo permanece segura.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
