<!-- Reset password | Subject: Redefina sua senha Fluxo -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redefina sua senha Fluxo</title>
</head>
<body style="margin:0;padding:24px;background:#ffffff;color:#102038;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;">
  <p style="margin:0 0 12px;font-weight:700;color:#0b1d36;">Fluxo</p>
  <p style="margin:0 0 16px;">Recebemos um pedido para redefinir a senha da sua conta Fluxo.</p>
  <p style="margin:0 0 20px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
       style="display:inline-block;background:#0b1d36;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:600;">
      Redefinir senha
    </a>
  </p>
  <p style="margin:0;color:#5a6b80;font-size:13px;">Se você não pediu isso, ignore este e-mail.</p>
</body>
</html>
